name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Developer Certificate of Origin: every commit in the PR carries a Signed-off-by
  # trailer (CONTRIBUTING.md). Runs on pull requests only — pushes to main are merges.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by trailer (git commit -s)"; missing=1
            fi
          done
          exit $missing

  # Operator identifiers are a DIFFERENT question from credentials, and `secret-scan`
  # cannot answer it: `.secrets.baseline` enables `is_potential_uuid`, a dashed uuid is
  # under the entropy limit anyway, and a `claude --resume <sid>` line is reported under
  # no configuration at all. PR #156 carried a real session id through a GREEN
  # secret-scan. Separate job, separate name, so a green tick means what it says.
  operator-identifier-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --git-ls enumerates tracked files internally: `$(git ls-files)` word-splits on
      # whitespace and lets a `-`-prefixed path be eaten as a flag. --min-files makes
      # coverage ENFORCED rather than printed, because nobody reads logs on a green run.
      - run: >-
          python3 scripts/scan_operator_identifiers.py --git-ls --min-files 1200
          --baseline scripts/operator_identifiers_baseline.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets
      - run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  # Run per top-level package rather than one pytest invocation over the
  # whole tree: a handful of tests leak global/module state across the full
  # single-process run (order-dependent, fails only at full-suite scale) —
  # see the good-first-issue for the isolation root cause. Splitting by
  # package keeps the suite green on day one without masking it.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestra-cli
            args: "orchestra_cli/tests"
          - name: root
            args: "test_router_prefixes.py test_msg_threading.py --ignore=scripts"
          - name: services-arturo
            args: "services/arturo"
          - name: scripts-top
            args: "scripts --ignore=scripts/lineage_daemon --ignore=scripts/identity_store --ignore=scripts/focus_registry"
          - name: scripts-lineage-daemon
            args: "scripts/lineage_daemon"
          - name: scripts-identity-store
            args: "scripts/identity_store"
          - name: scripts-focus-registry
            args: "scripts/focus_registry"
          - name: contract
            args: "contract"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || true
      - run: python3 -m pytest -q ${{ matrix.args }}

  api-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      # The route/lib tests were never run here (only typechecked), so 6 of 13 route files had
      # quietly stopped running on a clean checkout: they import config at load time and there
      # is no orchestra.toml. `npm test` points them at the example config.
      - run: npm test

  # The TS contract tests ran NOWHERE. `python-tests (contract, contract)` is pytest, and
  # neither contract/transcript/tests/conformance.test.ts nor codegen.test.ts was referenced
  # by any job -- so conformance went red in #124 (looksLikeCodex started requiring a
  # top-level `ordinal` that the codex fixtures never carried) and stayed red, unseen, for
  # every PR since. The test file's own header documented `npm run conformance`, a script
  # that did not exist either. Separate job, so the drift backstop cannot rot again.
  contract-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run conformance

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Pure-logic web tests (tsx + node:test, no DOM). There were none before this job ran them.
      - run: npm test
      - run: npm run build
