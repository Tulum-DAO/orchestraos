[pytest]
# Repo-wide test configuration. pytest picks ONE configfile from the common ancestor of the
# paths given on the command line; a nested ini (services/arturo/pytest.ini, where this
# setting used to live) only applied when that directory happened to be the rootdir, so
# `pytest services` and the whole-repo run fell back to strict mode and failed every bare
# `async def` test. Keep all pytest settings here.
asyncio_mode = auto
